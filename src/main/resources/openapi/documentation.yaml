components:
  schemas:
    ApiError:
      type: "object"
      properties:
        type:
          type: "string"
        message:
          type: "string"
        context:
          type: "string"
      required:
      - "type"
      - "message"
    Error:
      type: "object"
      properties:
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/ApiError"
      required:
      - "errors"
    BreadcrumbEntry:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        type:
          type: "string"
      required:
      - "id"
      - "name"
      - "type"
    Breadcrumb:
      type: "object"
      properties:
        entries:
          type: "array"
          items:
            $ref: "#/components/schemas/BreadcrumbEntry"
      required:
      - "entries"
    NetworkProduct:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
        size:
          type: "number"
          format: "double"
        unit:
          type: "string"
        attributes:
          type: "string"
        createdAt:
          type: "string"
        updatedAt:
          type: "string"
      required:
