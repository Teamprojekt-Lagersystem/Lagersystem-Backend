  /v1/spaces/{id}:
    delete:
      description: "route(\"/products\") { <br> get { <br> val id = call.parameters[\"\
        id\"]!! <br> val errors = mutableListOf<ApiError>() <br> if (!id.isUUID())\
        \ { <br> errors.add(ErrorMessages.INVALID_UUID_SPACE) <br> } <br> if (errors.isNotEmpty())\
        \ { <br> return@get call.respond(HttpStatusCode.BadRequest, ApiResponse.Error(errors))\
        \ <br> } <br> val space = spaceRepository.getSpace(id) <br> if (space == null)\
        \ { <br> errors.add(ErrorMessages.SPACE_NOT_FOUND) <br> return@get call.respond(HttpStatusCode.NotFound,\
        \ ApiResponse.Error(errors)) <br> } <br> val products = spaceRepository.getProducts(id)\
        \ <br> call.respond(products.map { it.toNetworkProduct() }) <br> } <br> }"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "400":
          description: "Bad Request"
          content:
