components:
  schemas:
    NetworkProduct:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
        size:
          type: "number"
          format: "double"
        unit:
          type: "string"
        attributes:
          type: "string"
        createdAt:
          type: "string"
        updatedAt:
          type: "string"
      required:
      - "id"
      - "name"
      - "description"
      - "attributes"
      - "createdAt"
    AddProductNetworkRequest:
      type: "object"
      properties:
        name:
          type: "string"
        description:
          type: "string"
        size:
          type: "number"
          format: "double"
        unit:
          type: "string"
      required:
      - "name"
      - "description"
    ApiError:
      type: "object"
      properties:
        type:
          type: "string"
        message:
          type: "string"
        context:
          type: "string"
      required:
      - "type"
      - "message"
    Error:
      type: "object"
      properties:
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/ApiError"
      required:
      - "errors"
    UpdateProductNetworkRequest:
      type: "object"
      properties:
        name:
          type: "string"
        description:
          type: "string"
        size:
          type: "number"
          format: "double"
    NetworkProductInSpace:
