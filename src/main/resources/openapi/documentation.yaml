          type: "string"
        name:
          type: "string"
        description:
          type: "string"
        size:
          type: "number"
          format: "double"
        unit:
          type: "string"
        attributes:
          type: "string"
        createdAt:
          type: "string"
        updatedAt:
          type: "string"
        quantity:
          type: "integer"
          format: "int32"
        storedAt:
          type: "string"
        modifiedAt:
          type: "string"
      required:
      - "id"
      - "name"
      - "description"
      - "attributes"
      - "createdAt"
      - "storedAt"
    NetworkSpace:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        totalSize:
          type: "number"
          format: "double"
        currentSize:
          type: "number"
          format: "double"
        unit:
          type: "string"
        description:
          type: "string"
        products:
          type: "array"
          items:
            $ref: "#/components/schemas/NetworkProductInSpace"
        storageId:
          type: "string"
        createdAt:
          type: "string"
        updatedAt:
          type: "string"
      required:
      - "id"
      - "name"
      - "description"
      - "products"
      - "storageId"
      - "createdAt"
    AddSpaceNetworkRequest:
      type: "object"
      properties:
        name:
          type: "string"
        totalSize:
          type: "number"
          format: "double"
        unit:
          type: "string"
        description:
          type: "string"
        storageId:
          type: "string"
      required:
      - "name"
      - "description"
      - "storageId"
    CopySpaceRequest:
      type: "object"
      properties:
        targetStorageId:
          type: "string"
      required:
      - "targetStorageId"
    MoveSpaceNetworkRequest:
